<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada · Toque de Mar</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --azul:#214E80; --teal:#00848F; --claro:#7FD8DE; --ink:#F7F6F2; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#143354;color:var(--ink);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg,.tint{position:fixed;inset:0}
.bg{background:url('/links/assets/loja-bg.jpg') center/cover;z-index:0}
.tint{background:#1B4470;opacity:.93;z-index:1}
.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
.page img{height:52px;width:auto;margin-bottom:28px}
.code{font-size:clamp(56px,14vw,96px);font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--claro)}
h1{margin:14px 0 0;font-size:clamp(20px,5vw,28px);font-weight:600;letter-spacing:-.01em}
p{margin:14px 0 0;max-width:40ch;color:rgba(255,255,255,.75);font-size:15.5px;font-weight:300;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:30px;background:var(--teal);color:#fff;border-radius:12px;padding:16px 26px;font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background .16s}
.btn:hover{background:#00707A}
</style>
</head>
<body>
<div class="bg"></div>
<div class="tint"></div>
<div class="page">
  <img src="/links/assets/logo-white.png" alt="Toque de Mar">
  <div class="code">404</div>
  <h1>Essa página não existe</h1>
  <p>O link que você seguiu não foi encontrado. Mas os salgados continuam existindo, vem ver.</p>
  <a class="btn" href="/">Voltar ao início</a>
</div>
</body>
</html>
