<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Visualizações — Toque de Mar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../links/assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: #0b1f33; }
  body { margin: 0; background: #0b1f33; font-family: 'Outfit', sans-serif; color: #f2f2f0; }

  #password-gate {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(6,18,32,.94), rgba(6,18,32,.98)), url('../links/assets/loja-bg.jpg') center/cover;
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  .gate-card { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 280px; }
  .gate-logo { width: 120px; height: auto; }
  #gate-input, #gate-button {
    width: 260px; max-width: 100%; padding: 11px 14px;
    font-family: 'Outfit', sans-serif; font-size: 13px; border-radius: 999px; border: none;
  }
  #gate-input { background: rgba(255,255,255,.95); color: #1B4470; }
  #gate-input:focus { outline: none; background: #fff; }
  #gate-button {
    background: #fff; color: #1B4470; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    cursor: pointer; transition: transform .15s ease;
  }
  #gate-button:hover { transform: translateY(-1px); }
  #gate-error { background: rgba(255,255,255,.95); color: #a33; font-size: 12px; font-weight: 600; text-align: center; width: 100%; margin: 0; padding: 8px 12px; border-radius: 8px; }

  #dashboard-content { padding: 40px 20px 80px; }
  .dash-header { display: flex; align-items: center; gap: 18px; max-width: 900px; margin: 0 auto 28px; flex-wrap: wrap; }
  .dash-logo { width: 56px; height: auto; flex-shrink: 0; }
  .dash-title { font-size: 24px; text-transform: uppercase; letter-spacing: .04em; color: #f2f2f0; margin: 0; }
  .dash-updated { font-size: 11.5px; color: rgba(255,255,255,.5); margin: 6px 0 0; }

  .content-row { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: 0 auto; }
  .content-row .tab-panel { order: 1; }
  .content-row #cal-widget { order: 2; }
  @media (min-width: 1500px) {
    .content-row { display: block; position: relative; }
    .content-row #cal-widget {
      position: absolute;
      top: 0;
      right: 100%;
      margin-right: 20px;
      width: 280px;
    }
  }
  .period-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .period-btn {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7);
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 7px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .period-btn:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .period-btn.active { background: #fff; border-color: #fff; color: #1B4470; }

  .page-tab-btn {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7);
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 7px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .page-tab-btn:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .page-tab-btn.active { background: #00848F; border-color: #00848F; color: #fff; }

  .advanced-toggle {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7);
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 7px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .advanced-toggle:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .advanced-toggle.active, .advanced-toggle.open { background: #fff; border-color: #fff; color: #1B4470; }

  .advanced-panel {
    display: none; flex-direction: column; align-items: flex-start; gap: 12px; width: 100%;
    max-width: 900px; margin: 10px auto 24px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 16px;
  }
  .advanced-panel.open { display: flex; }
  .advanced-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .advanced-label { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.5); min-width: 60px; }

  .month-picker {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.85);
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .month-picker:hover { border-color: rgba(255,255,255,.6); }
  .month-picker.active { background: #fff; border-color: #fff; color: #1B4470; }
  .month-picker option { background: #0f2a48; color: #f2f2f0; }

  .date-range { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .date-field { position: relative; display: inline-flex; align-items: center; }
  .date-input {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.85);
    font-family: 'Outfit', sans-serif; font-size: 11px; padding: 5px 28px 5px 8px; border-radius: 8px; color-scheme: dark;
    width: 110px;
  }
  .date-input:hover, .date-input:focus { border-color: rgba(255,255,255,.6); outline: none; }
  .calendar-icon {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,.6); pointer-events: none; display: flex; z-index: 1;
  }
  .date-field:hover .calendar-icon { color: #fff; }
  .calendar-native {
    position: absolute; right: 0; top: 0; width: 26px; height: 100%;
    opacity: 0; cursor: pointer; border: none; padding: 0; margin: 0; color-scheme: dark; z-index: 2;
  }
  .date-sep { font-size: 10px; color: rgba(255,255,255,.5); text-transform: uppercase; }
  .date-apply {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7);
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .date-apply:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .date-apply.active { background: #fff; border-color: #fff; color: #1B4470; }

  .advanced-error { font-size: 11.5px; color: #ff8a8a; margin: 0; width: 100%; }

  .cal-widget {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 16px;
    max-width: 280px;
    flex: 1 1 250px;
  }
  .cal-caption-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 11px; }
  .cal-caption { margin: 0; font-size: 10px; letter-spacing: 0.3px; color: rgba(255,255,255,.5); }
  .cal-range-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 20px;
    padding: 4px 9px;
    color: rgba(255,255,255,.7);
    font-family: 'Outfit', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .cal-range-toggle:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .cal-range-toggle.active { background: #fff; border-color: #fff; color: #1B4470; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
  .cal-month-label { font-family: 'Outfit', sans-serif; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; color: #f2f2f0; }
  .cal-nav {
    background: transparent;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    color: rgba(255,255,255,.7);
    width: 22px;
    height: 22px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .cal-nav:hover { border-color: rgba(255,255,255,.6); color: #fff; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3.5px; margin-bottom: 3.5px; }
  .cal-weekdays span { text-align: center; font-size: 8.5px; color: rgba(255,255,255,.5); text-transform: uppercase; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3.5px; }
  .cal-day {
    aspect-ratio: 1;
    background: rgba(255,255,255,.08);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    cursor: pointer;
    transition: box-shadow 0.1s;
  }
  .cal-day-empty { background: transparent; cursor: default; }
  .cal-day-today { box-shadow: inset 0 0 0 1.5px rgba(242,242,240,0.5); }
  .cal-day-selected { box-shadow: inset 0 0 0 2px #ffffff; }
  .cal-day-pending { box-shadow: inset 0 0 0 2px #ffffff; opacity: 0.85; }
  .cal-day-num { font-size: 8.25px; color: rgba(255,255,255,0.55); }
  .cal-day-count { font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 600; color: #ffffff; line-height: 1; }

  .tab-panel { min-width: 0; }
  .visits-block { display: flex; align-items: baseline; gap: 10px; margin-bottom: 28px; }
  .visits-num { font-size: 40px; font-weight: 700; color: #fff; line-height: 1; }
  .visits-label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.6); }

  .dash-subtitle { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: rgba(255,255,255,.5); margin: 0 0 14px; }

  .metric-list { display: flex; flex-direction: column; }
  .metric-row { display: flex; align-items: center; gap: 16px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .metric-info { flex: 1; min-width: 0; }
  .metric-name { font-size: 13.5px; color: #e5e5e5; margin-bottom: 7px; }
  .metric-track { height: 4px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; }
  .metric-fill { height: 100%; width: 0%; background: #fff; border-radius: 999px; transition: width .5s ease; }
  .metric-value { font-size: 17px; font-weight: 600; color: #f2f2f0; min-width: 34px; text-align: right; flex-shrink: 0; }

  .dash-empty { text-align: center; color: rgba(255,255,255,.6); padding: 40px; display: none; }

  @media (max-width: 480px) {
    .gate-logo { width: 96px; }
    #gate-input, #gate-button { width: 100%; }
    #dashboard-content { padding: 26px 16px 60px; }
    .dash-title { font-size: 19px; }
    .visits-num { font-size: 32px; }
  }
</style>
</head>
<body>

<div id="password-gate">
  <div class="gate-card">
    <img src="../links/assets/logo-white.png" alt="Toque de Mar" class="gate-logo">
    <input type="password" id="gate-input" placeholder="Senha" autocomplete="off">
    <button id="gate-button">Entrar</button>
    <p id="gate-error" style="display:none;">Senha incorreta</p>
  </div>
</div>

<div id="dashboard-content" style="display:none;">
  <div class="dash-header">
    <img src="../links/assets/logo-white.png" alt="Toque de Mar" class="dash-logo">
    <div>
      <h1 class="dash-title">Painel de Visualizações</h1>
      <p class="dash-updated" id="dash-updated"></p>
    </div>
  </div>

  <div class="period-filter" id="page-tabs" style="max-width:900px;margin:0 auto 14px">
    <button type="button" class="page-tab-btn active" data-page="links">Linktree</button>
    <button type="button" class="page-tab-btn" data-page="lp">Site Oficial</button>
  </div>

  <div class="period-filter" id="period-filter" style="max-width:900px;margin:0 auto 20px">
    <button class="period-btn active" data-period="hoje">Hoje</button>
    <button class="period-btn" data-period="ontem">Ontem</button>
    <button class="period-btn" data-period="semana">Essa Semana</button>
    <button class="period-btn" data-period="mes">Esse Mês</button>
    <button class="period-btn" data-period="total">Total</button>
    <button type="button" class="advanced-toggle" id="advanced-toggle">Avançado</button>
  </div>

  <div class="advanced-panel" id="advanced-panel">
    <div class="advanced-row">
      <span class="advanced-label">Mês</span>
      <select class="month-picker" id="month-picker"><option value="">Escolher mês…</option></select>
      <button type="button" class="date-apply" id="month-apply">Aplicar</button>
    </div>
    <div class="advanced-row">
      <span class="advanced-label">Período</span>
      <span class="date-range">
        <span class="date-field">
          <input type="text" class="date-input" id="date-start" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" autocomplete="off">
          <span class="calendar-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <input type="date" class="calendar-native" id="calendar-start-input" aria-label="Escolher data pelo calendário">
        </span>
        <span class="date-sep">até</span>
        <span class="date-field">
          <input type="text" class="date-input" id="date-end" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" autocomplete="off">
          <span class="calendar-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <input type="date" class="calendar-native" id="calendar-end-input" aria-label="Escolher data pelo calendário">
        </span>
        <button type="button" class="date-apply" id="date-apply">Aplicar</button>
      </span>
    </div>
    <p class="advanced-error" id="advanced-error" style="display:none;"></p>
  </div>

  <div class="content-row">
    <div class="cal-widget" id="cal-widget">
      <div class="cal-caption-row">
        <p class="cal-caption" id="cal-caption">Visitas por dia nesta página</p>
        <button type="button" class="cal-range-toggle" id="cal-range-toggle">Período</button>
      </div>
      <div class="cal-header">
        <button type="button" class="cal-nav" data-dir="-1" aria-label="Mês anterior">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button type="button" class="cal-nav" data-dir="1" aria-label="Próximo mês">›</button>
      </div>
      <div class="cal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="tab-panel">
      <div class="visits-block">
        <span class="visits-num" id="page-visits">0</span>
        <span class="visits-label" id="page-visits-label">visitas no linktree</span>
      </div>
      <p class="dash-subtitle">Cliques por botão</p>
      <div class="metric-list" id="page-events"></div>
    </div>
  </div>

  <div class="dash-empty" id="dash-empty">Estatísticas ainda não disponíveis, volte em breve.</div>
</div>

<script>
  var GIST_ID = '245337becc52e524000498c7067c21f4';
  var CORRECT_HASH = "5b0435c4cb418f242802f1d38927f63d4f359ee0f9574d79fc46e34f46f28053";

  var PAGES = {
    links: {
      path: '/links/',
      visitsLabel: 'visitas no linktree',
      baseline: {"2026-08-28":2,"2026-08-29":65,"2026-08-30":29,"2026-08-31":39,"2026-09-01":69,"2026-09-02":50,"2026-09-03":60,"2026-09-04":70,"2026-09-05":27},
      events: [
        ['whatsapp-pedido', 'WhatsApp'],
        ['delivery-ifood', 'iFood'],
        ['delivery-cardapio', 'Cardápio Digital'],
        ['nav-localizacao', 'Localização'],
        ['loc-google-maps', 'Google Maps'],
        ['loc-waze', 'Waze'],
        ['nav-atacado', 'Pedidos Atacado'],
        ['nav-avalie-google', 'Avalie no Google'],
        ['social-facebook', 'Facebook']
      ]
    },
    lp: {
      path: '/lp/',
      visitsLabel: 'visitas no site oficial',
      baseline: {},
      events: [
        ['lp-peca-aqui', 'Peça Aqui'],
        ['lp-como-chegar', 'Como Chegar'],
        ['lp-delivery-ifood', 'iFood'],
        ['lp-delivery-cardapio', 'Cardápio Digital'],
        ['lp-whatsapp-pedido', 'WhatsApp'],
        ['lp-loc-google-maps', 'Google Maps'],
        ['lp-loc-waze', 'Waze'],
        ['lp-nav-atacado', 'Pedidos Atacado'],
        ['lp-avalie-google', 'Avalie no Google'],
        ['lp-social-instagram', 'Instagram'],
        ['lp-social-facebook', 'Facebook']
      ]
    }
  };
  var currentPage = 'links';

  var STATS = null;
  var currentPeriod = 'hoje';

  async function sha256(text) {
    var buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buffer)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function showDashboard() {
    document.getElementById('password-gate').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
    loadStats();
  }

  if (localStorage.getItem('tdm_dashboard_auth') === CORRECT_HASH) {
    showDashboard();
  }

  document.getElementById('gate-button').addEventListener('click', async function () {
    var input = document.getElementById('gate-input').value;
    var hash = await sha256(input);
    if (hash === CORRECT_HASH) {
      localStorage.setItem('tdm_dashboard_auth', CORRECT_HASH);
      showDashboard();
    } else {
      document.getElementById('gate-error').style.display = 'block';
    }
  });

  document.getElementById('gate-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('gate-button').click();
  });

  var monthPicker = document.getElementById('month-picker');
  var monthApply = document.getElementById('month-apply');
  var advancedToggle = document.getElementById('advanced-toggle');
  var advancedPanel = document.getElementById('advanced-panel');
  var dateStart = document.getElementById('date-start');
  var dateEnd = document.getElementById('date-end');
  var dateApply = document.getElementById('date-apply');
  var advancedError = document.getElementById('advanced-error');

  function showAdvancedError(msg) {
    advancedError.textContent = msg;
    advancedError.style.display = 'block';
  }
  function clearAdvancedError() {
    advancedError.style.display = 'none';
  }

  // Mascara dd/mm/aaaa nos campos de texto (formato fixo, independente do idioma do navegador)
  [dateStart, dateEnd].forEach(function (input) {
    input.addEventListener('input', function () {
      var digits = input.value.replace(/\D/g, '').slice(0, 8);
      var out = digits.slice(0, 2);
      if (digits.length > 2) out += '/' + digits.slice(2, 4);
      if (digits.length > 4) out += '/' + digits.slice(4, 8);
      input.value = out;
    });
  });

  function parseBrDate(str) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str || '').trim());
    if (!m) return null;
    var day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
    var d = new Date(year, month - 1, day);
    if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
    return isoDate(d);
  }

  function brFromIso(iso) {
    var parts = (iso || '').split('-');
    if (parts.length !== 3) return '';
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  // Input nativo de data (invisivel, sobre o icone) abre o calendario do navegador ao ser clicado
  // diretamente; ao escolher uma data, preenche o campo de texto correspondente.
  [['calendar-start-input', dateStart], ['calendar-end-input', dateEnd]].forEach(function (cfg) {
    var nativeInput = document.getElementById(cfg[0]);
    var textInput = cfg[1];
    nativeInput.addEventListener('focus', function () {
      var iso = parseBrDate(textInput.value);
      nativeInput.value = iso || '';
    });
    nativeInput.addEventListener('change', function () {
      if (nativeInput.value) textInput.value = brFromIso(nativeInput.value);
    });
  });

  document.querySelectorAll('.page-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.page-tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPage = btn.getAttribute('data-page');
      clearCalSelection();
      renderCalendar();
      renderDashboard();
    });
  });

  document.querySelectorAll('.period-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.period-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      monthPicker.value = '';
      monthPicker.classList.remove('active');
      dateApply.classList.remove('active');
      clearAdvancedError();
      clearCalSelection();
      advancedPanel.classList.remove('open');
      advancedToggle.classList.remove('open');
      currentPeriod = btn.getAttribute('data-period');
      renderDashboard();
    });
  });

  advancedToggle.addEventListener('click', function () {
    var isOpen = advancedPanel.classList.toggle('open');
    advancedToggle.classList.toggle('open', isOpen);
  });

  monthApply.addEventListener('click', function () {
    if (!monthPicker.value) return;
    clearAdvancedError();
    document.querySelectorAll('.period-btn').forEach(function (b) { b.classList.remove('active'); });
    monthPicker.classList.add('active');
    dateApply.classList.remove('active');
    dateStart.value = '';
    dateEnd.value = '';
    clearCalSelection();
    currentPeriod = 'month:' + monthPicker.value;
    renderDashboard();
  });

  dateApply.addEventListener('click', function () {
    var startIso = parseBrDate(dateStart.value);
    var endIso = parseBrDate(dateEnd.value);
    if (!startIso || !endIso) {
      showAdvancedError('Preencha as duas datas no formato dd/mm/aaaa.');
      return;
    }
    if (startIso > endIso) {
      showAdvancedError('A data inicial não pode ser depois da data final.');
      return;
    }
    clearAdvancedError();
    document.querySelectorAll('.period-btn').forEach(function (b) { b.classList.remove('active'); });
    monthPicker.value = '';
    monthPicker.classList.remove('active');
    dateApply.classList.add('active');
    clearCalSelection();
    currentPeriod = 'range:' + startIso + ':' + endIso;
    renderDashboard();
  });

  // ---- Calendario de visitas ----
  var calMonth = (function () { var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1 }; })();
  var calSelection = { pendingStart: null, activeStart: null, activeEnd: null, rangeMode: false };

  function getPageDays() {
    var page = PAGES[currentPage];
    if (!STATS || !STATS.items) return Object.assign({}, page.baseline);
    var target = normPath(page.path);
    var merged = Object.assign({}, page.baseline);
    for (var i = 0; i < STATS.items.length; i++) {
      var item = STATS.items[i];
      if (!item.event && normPath(item.path) === target) {
        var days = item.days || {};
        for (var d in days) merged[d] = (merged[d] || 0) + days[d];
      }
    }
    return merged;
  }

  function heatColor(ratio) {
    var cold = [22, 46, 70];
    var hot = [0, 132, 143];
    var r = Math.round(cold[0] + (hot[0] - cold[0]) * ratio);
    var g = Math.round(cold[1] + (hot[1] - cold[1]) * ratio);
    var b = Math.round(cold[2] + (hot[2] - cold[2]) * ratio);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function clearCalSelection() {
    calSelection.pendingStart = null;
    calSelection.activeStart = null;
    calSelection.activeEnd = null;
    calSelection.rangeMode = false;
    renderCalendar();
  }

  function applyCalRange(startIso, endIso) {
    document.querySelectorAll('.period-btn').forEach(function (b) { b.classList.remove('active'); });
    monthPicker.value = '';
    monthPicker.classList.remove('active');
    monthApply.classList.remove('active');
    dateApply.classList.remove('active');
    clearAdvancedError();
    advancedPanel.classList.remove('open');
    advancedToggle.classList.remove('open');

    currentPeriod = 'range:' + startIso + ':' + endIso;
    calSelection.activeStart = startIso;
    calSelection.activeEnd = endIso;
    renderDashboard();
  }

  function handleCalDayClick(iso) {
    var sel = calSelection;
    if (sel.rangeMode) {
      if (sel.pendingStart) {
        var start = sel.pendingStart, end = iso;
        if (end < start) { var tmp = start; start = end; end = tmp; }
        sel.pendingStart = null;
        sel.rangeMode = false;
        applyCalRange(start, end);
      } else {
        sel.pendingStart = iso;
        applyCalRange(iso, iso);
      }
    } else {
      sel.pendingStart = null;
      applyCalRange(iso, iso);
    }
    renderCalendar();
  }

  function toggleCalRangeMode() {
    calSelection.rangeMode = !calSelection.rangeMode;
    calSelection.pendingStart = null;
    renderCalendar();
  }

  document.getElementById('cal-range-toggle').addEventListener('click', toggleCalRangeMode);

  document.querySelectorAll('#cal-widget .cal-nav').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var dir = parseInt(btn.getAttribute('data-dir'), 10);
      var d = new Date(calMonth.y, calMonth.m - 1 + dir, 1);
      calMonth = { y: d.getFullYear(), m: d.getMonth() + 1 };
      renderCalendar();
    });
  });

  function renderCalendar() {
    var widget = document.getElementById('cal-widget');
    if (!widget) return;
    var y = calMonth.y, m = calMonth.m;
    var days = getPageDays();
    var sel = calSelection;

    document.getElementById('cal-month-label').textContent = MONTH_NAMES[m - 1] + ' de ' + y;
    document.getElementById('cal-caption').textContent = sel.pendingStart
      ? 'Clique em outro dia para fechar o período'
      : sel.rangeMode
        ? 'Clique no dia inicial do período'
        : 'Visitas por dia nesta página';
    var rangeToggle = document.getElementById('cal-range-toggle');
    rangeToggle.classList.toggle('active', !!sel.rangeMode);
    rangeToggle.textContent = sel.rangeMode ? 'Cancelar' : 'Período';

    var firstWeekday = new Date(y, m - 1, 1).getDay();
    var daysInMonth = new Date(y, m, 0).getDate();
    var todayStr = isoDate(new Date());

    var maxCount = 0;
    for (var d = 1; d <= daysInMonth; d++) {
      var isoKey = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      if ((days[isoKey] || 0) > maxCount) maxCount = days[isoKey] || 0;
    }

    var grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    for (var i = 0; i < firstWeekday; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-day cal-day-empty';
      grid.appendChild(blank);
    }
    for (var d2 = 1; d2 <= daysInMonth; d2++) {
      var iso2 = y + '-' + String(m).padStart(2, '0') + '-' + String(d2).padStart(2, '0');
      var count = days[iso2] || 0;
      var cell = document.createElement('div');
      cell.className = 'cal-day';
      if (iso2 === todayStr) cell.classList.add('cal-day-today');
      if (sel.pendingStart === iso2) {
        cell.classList.add('cal-day-pending');
      } else if (sel.activeStart && iso2 >= sel.activeStart && iso2 <= sel.activeEnd) {
        cell.classList.add('cal-day-selected');
      }
      if (count > 0) {
        cell.style.background = heatColor(maxCount > 0 ? count / maxCount : 0);
        cell.title = brFromIso(iso2) + ': ' + count + (count === 1 ? ' visita' : ' visitas');
      } else {
        cell.title = brFromIso(iso2) + ': sem visitas';
      }
      cell.innerHTML = '<span class="cal-day-num">' + d2 + '</span>' + (count > 0 ? '<span class="cal-day-count">' + count + '</span>' : '');
      cell.addEventListener('click', function (clickedIso) {
        return function () { handleCalDayClick(clickedIso); };
      }(iso2));
      grid.appendChild(cell);
    }
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function getRange(key) {
    var today = new Date();
    var todayStr = isoDate(today);
    if (key === 'hoje') return [todayStr, todayStr];
    if (key === 'ontem') {
      var y = new Date(today); y.setDate(y.getDate() - 1);
      return [isoDate(y), isoDate(y)];
    }
    if (key === 'semana') {
      var sinceMonday = (today.getDay() + 6) % 7;
      var mon = new Date(today); mon.setDate(mon.getDate() - sinceMonday);
      return [isoDate(mon), todayStr];
    }
    if (key === 'mes') {
      var first = new Date(today.getFullYear(), today.getMonth(), 1);
      return [isoDate(first), todayStr];
    }
    if (key.indexOf('month:') === 0) {
      var parts = key.slice(6).split('-');
      var y2 = parseInt(parts[0], 10), m2 = parseInt(parts[1], 10);
      var first2 = new Date(y2, m2 - 1, 1);
      var last2 = new Date(y2, m2, 0);
      return [isoDate(first2), isoDate(last2)];
    }
    if (key.indexOf('range:') === 0) {
      var rp = key.slice(6).split(':');
      return [rp[0], rp[1]];
    }
    return [null, null];
  }

  var MONTH_NAMES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  function populateMonthPicker() {
    if (!STATS || !STATS.items) return;
    var monthSet = {};
    STATS.items.forEach(function (item) {
      Object.keys(item.days || {}).forEach(function (day) {
        monthSet[day.slice(0, 7)] = true;
      });
    });
    var keys = Object.keys(monthSet).sort().reverse();
    keys.forEach(function (key) {
      var parts = key.split('-');
      var label = MONTH_NAMES[parseInt(parts[1], 10) - 1] + ' de ' + parts[0];
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = label;
      monthPicker.appendChild(opt);
    });
  }


  function resolvePeriod() {
    if (!STATS || !STATS.items) return null;
    var range = getRange(currentPeriod);
    var pages = [], events = [];
    STATS.items.forEach(function (item) {
      var count = 0;
      var days = item.days || {};
      if (range[0] === null) {
        for (var d in days) count += days[d];
      } else {
        for (var d2 in days) {
          if (d2 >= range[0] && d2 <= range[1]) count += days[d2];
        }
      }
      var entry = { path: item.path, count: count };
      (item.event ? events : pages).push(entry);
    });
    return { pages: pages, events: events };
  }

  function normPath(p) {
    return (p || '').toLowerCase().replace(/^\/+/, '').replace(/\/+$/, '');
  }

  function findCount(list, path) {
    var target = normPath(path);
    for (var i = 0; i < list.length; i++) {
      if (normPath(list[i].path) === target) return list[i].count;
    }
    return 0;
  }

  function renderMetricList(containerId, registry, eventsList) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    var items = registry.map(function (entry) {
      return { label: entry[1], count: findCount(eventsList, entry[0]) };
    });
    items.sort(function (a, b) { return b.count - a.count; });
    var max = Math.max.apply(null, items.map(function (x) { return x.count; }).concat([1]));
    items.forEach(function (item) {
      var pct = Math.round((item.count / max) * 100);
      var row = document.createElement('div');
      row.className = 'metric-row';
      row.innerHTML =
        '<div class="metric-info">' +
          '<div class="metric-name">' + item.label + '</div>' +
          '<div class="metric-track"><div class="metric-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="metric-value">' + item.count + '</div>';
      container.appendChild(row);
    });
  }

  function renderDashboard() {
    var period = resolvePeriod();
    if (!period) return;
    var page = PAGES[currentPage];
    var range = getRange(currentPeriod);
    var baselineTotal = 0;
    for (var d in page.baseline) {
      if (range[0] === null || (d >= range[0] && d <= range[1])) baselineTotal += page.baseline[d];
    }
    document.getElementById('page-visits').textContent = baselineTotal + findCount(period.pages, page.path);
    document.getElementById('page-visits-label').textContent = page.visitsLabel;
    renderMetricList('page-events', page.events, period.events);
  }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  async function loadStats() {
    try {
      var res = await fetch('https://api.github.com/gists/' + GIST_ID);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var gist = await res.json();
      STATS = JSON.parse(gist.files['stats.json'].content);
      document.getElementById('dash-updated').textContent = STATS.updated_at ? ('Atualizado em: ' + formatDate(STATS.updated_at)) : 'Ainda sem dados';
      populateMonthPicker();
      renderDashboard();
      renderCalendar();
    } catch (err) {
      document.getElementById('dash-empty').style.display = 'block';
      console.error(err);
    }
  }
</script>

</body>
</html>
