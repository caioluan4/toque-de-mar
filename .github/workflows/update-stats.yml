name: Atualizar stats.json

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualiza o Gist com os dados do GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: toquedemar
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
        run: python3 scripts/update_stats.py
